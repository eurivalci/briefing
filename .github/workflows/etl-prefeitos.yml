name: ETL prefeitos (TSE)

on:
  schedule:
    - cron: "0 6 * * 1"   # segundas, 03h de Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etl-prefeitos
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Testes do ETL
        run: python3 tests/test_etl.py

      - name: Baixar arquivos do TSE
        run: |
          set -euo pipefail
          mkdir -p tse_raw && cd tse_raw
          BASE=https://cdn.tse.jus.br/estatistica/sead/odsele
          baixa() { curl -fL --retry 3 --retry-delay 10 -o "$2" "$1"; }
          opcional() {
            if curl -fL --retry 2 -o "$2" "$1"; then return 0; fi
            echo "::notice::arquivo opcional ausente no TSE: $1"
            rm -f "$2"
            return 0
          }
          # obrigatórios
          baixa "$BASE/consulta_cand/consulta_cand_2024.zip"                         cand_2024.zip
          baixa "$BASE/votacao_candidato_munzona/votacao_candidato_munzona_2024.zip" votos_2024.zip
          baixa "$BASE/bem_candidato/bem_candidato_2024.zip"                         bens_2024.zip
          # eleições suplementares municipais (publicação varia por ano)
          opcional "$BASE/consulta_cand/consulta_cand_2025.zip" cand_2025.zip
          opcional "$BASE/consulta_cand/consulta_cand_2026.zip" cand_2026.zip
          # trajetória
          for a in 2016 2018 2020 2022; do
            opcional "$BASE/consulta_cand/consulta_cand_$a.zip" hist_$a.zip
          done
          ls -lh

      - name: Rodar ETL
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Monta a lista só com arquivos que existem. Nada de "[ -f ] && ..." como
          # último comando: com set -e um teste falso encerra o passo em silêncio.
          CAND=()
          for f in tse_raw/cand_2024.zip tse_raw/cand_2025.zip tse_raw/cand_2026.zip; do
            if [ -f "$f" ]; then CAND+=("$f"); fi
          done
          HIST=(tse_raw/hist_*.zip)
          echo "candidaturas: ${CAND[*]}"
          echo "histórico: ${HIST[*]:-nenhum}"
          ARGS=(--cand "${CAND[@]}" --votos tse_raw/votos_2024.zip --bens tse_raw/bens_2024.zip)
          if [ ${#HIST[@]} -gt 0 ]; then ARGS+=(--historico "${HIST[@]}"); fi
          python3 etl/build_prefeitos.py "${ARGS[@]}"

      - name: Conferir cobertura
        run: |
          python3 - <<'PY'
          import json, sys
          a = json.load(open("data/prefeitos/_auditoria.json", encoding="utf-8"))
          total = a["total_municipios_com_prefeito"]
          print(f"municípios com prefeito: {total}")
          print(f"via de-para: {a['via_depara']} | via nome: {len(a['via_nome'])} | "
                f"não resolvidos: {len(a['nao_resolvidos'])} | sem eleito: {len(a['municipios_sem_eleito_nos_arquivos'])}")
          print(f"votos: {a['votos_carregados']} | bens: {a['bens_carregados']} | histórico: {a['historico_carregado']}")
          # trava de sanidade: abaixo disso algo quebrou no layout ou no download
          if total < 5400:
              print("::error::cobertura anormalmente baixa; publicação abortada")
              sys.exit(1)
          PY

      - name: Fotos dos prefeitos
        # falha aqui não impede publicar os dados eleitorais
        continue-on-error: true
        timeout-minutes: 30
        run: |
          set -euo pipefail
          pip install --quiet "pillow>=10"
          python3 tests/test_fotos.py
          # encerra limpo antes do timeout do passo; o que faltar continua na próxima execução
          python3 etl/fotos_prefeitos.py --paralelo 12 --limite-minutos 24

      - name: Dados dos municípios (IBGE + Wikidata)
        # falha aqui não impede publicar; fonte fora do ar mantém os valores da semana anterior
        continue-on-error: true
        timeout-minutes: 20
        run: |
          python3 tests/test_enriquecer.py
          python3 etl/enriquecer_municipios.py

      - name: CAPAG (Tesouro Nacional)
        # primeira execução baixa todas as posições (~20 MB cada); depois, só as novas
        continue-on-error: true
        timeout-minutes: 30
        run: |
          set -euo pipefail
          pip install --quiet "openpyxl>=3.1"
          python3 tests/test_capag.py
          python3 etl/capag.py

      - name: Consolidado nacional (todos.json / todos.csv)
        run: |
          python3 tests/test_consolidar.py
          python3 etl/consolidar_prefeitos.py

      - name: Guardar auditoria
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: auditoria-etl
          path: |
            data/prefeitos/_auditoria.json
            data/fotos/_manifest.json
            data/municipios/municipios.json
            data/capag/_auditoria.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Publicar se houve mudança
        run: |
          set -euo pipefail
          git config user.name "etl-bot"
          git config user.email "etl-bot@users.noreply.github.com"
          git add data/prefeitos
          if [ -d data/fotos ]; then git add data/fotos; fi
          if [ -d data/municipios ]; then git add data/municipios; fi
          if [ -d data/capag ]; then git add data/capag; fi
          if git diff --cached --quiet; then echo "sem mudanças"; exit 0; fi
          git commit -m "dados: atualiza prefeitos (TSE) $(date -u +%F)"
          # se alguém editou o repositório durante a execução, sincroniza antes de publicar
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
