name: ETL prefeitos (TSE)

on:
  schedule:
    - cron: "0 6 * * 1"   # segundas, 03h de Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etl-prefeitos
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes do ETL
        run: python3 tests/test_etl.py

      - name: Baixar arquivos do TSE
        run: |
          set -euo pipefail
          mkdir -p tse_raw && cd tse_raw
          BASE=https://cdn.tse.jus.br/estatistica/sead/odsele
          baixa() { curl -fL --retry 3 --retry-delay 10 -o "$2" "$1"; }
          opcional() { curl -fL --retry 2 -o "$2" "$1" || { echo "::notice::ausente: $1"; rm -f "$2"; }; }
          # obrigatórios
          baixa "$BASE/consulta_cand/consulta_cand_2024.zip" consulta_cand_2024.zip
          baixa "$BASE/votacao_candidato_munzona/votacao_candidato_munzona_2024.zip" votacao_candidato_munzona_2024.zip
          baixa "$BASE/bem_candidato/bem_candidato_2024.zip" bem_candidato_2024.zip
          # eleições suplementares (publicadas por ano; ausência não é erro)
          opcional "$BASE/consulta_cand/consulta_cand_2025.zip" consulta_cand_2025.zip
          opcional "$BASE/consulta_cand/consulta_cand_2026.zip" sup_consulta_cand_2026.zip
          # trajetória
          for a in 2016 2018 2020 2022; do opcional "$BASE/consulta_cand/consulta_cand_$a.zip" hist_consulta_cand_$a.zip; done
          ls -lh

      - name: Rodar ETL
        run: |
          set -euo pipefail
          shopt -s nullglob
          CAND=(tse_raw/consulta_cand_2024.zip tse_raw/consulta_cand_2025.zip)
          CAND=($(for f in "${CAND[@]}"; do [ -f "$f" ] && echo "$f"; done))
          HIST=(tse_raw/hist_consulta_cand_*.zip)
          # Arquivo de 2026 mistura eleição geral e suplementares municipais; o ETL filtra pelo cargo 11/12.
          [ -f tse_raw/sup_consulta_cand_2026.zip ] && CAND+=(tse_raw/sup_consulta_cand_2026.zip)
          ARGS=(--cand "${CAND[@]}" --votos tse_raw/votacao_candidato_munzona_2024.zip --bens tse_raw/bem_candidato_2024.zip)
          if [ ${#HIST[@]} -gt 0 ]; then ARGS+=(--historico "${HIST[@]}"); fi
          python3 etl/build_prefeitos.py "${ARGS[@]}"
          python3 - <<'PY'
          import json
          a = json.load(open("data/prefeitos/_auditoria.json", encoding="utf-8"))
          total = a["total_municipios_com_prefeito"]
          print(f"municípios com prefeito: {total}")
          print(f"não resolvidos: {len(a['nao_resolvidos'])} | sem eleito: {len(a['municipios_sem_eleito_nos_arquivos'])}")
          # trava de sanidade: abaixo disso algo quebrou no layout ou no download
          assert total >= 5400, "cobertura anormalmente baixa; abortando publicação"
          PY

      - name: Publicar se houve mudança
        run: |
          git config user.name "etl-bot"
          git config user.email "etl-bot@users.noreply.github.com"
          git add data/prefeitos
          if git diff --cached --quiet; then echo "sem mudanças"; exit 0; fi
          git commit -m "dados: atualiza prefeitos (TSE) $(date -u +%F)"
          git push
